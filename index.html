<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pelanggaran Siswa - SMP Gelora Bekasi</title>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- ExcelJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
        
        .container { 
            max-width: 900px; 
            margin: auto; 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 0 10px rgba(0,0,0,0.1); 
            position: relative; 
            overflow: hidden;    
        }

        /* Watermark Berbayang / Transparan */
        .container::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;                   
            height: 350px;                  
            background-image: url('https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9c/Logo_of_Ministry_of_Education_and_Culture_of_Republic_of_Indonesia.svg/960px-Logo_of_Ministry_of_Education_and_Culture_of_Republic_of_Indonesia.svg.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.08;                  
            pointer-events: none;           
            z-index: 0;                     
        }

        .container > * {
            position: relative;
            z-index: 1;
        }

        h2 { text-align: center; color: #1f4e78; margin-bottom: 5px; text-transform: uppercase; }
        h3.school-name { text-align: center; color: #2f5597; margin-top: 0; margin-bottom: 5px; font-size: 18px; }
        .sub-title { text-align: center; font-weight: bold; color: #333; margin-top: 0; margin-bottom: 20px; font-size: 14px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-submit { background-color: #28a745; color: white; width: 100%; }
        .btn-excel { background-color: #1f4e78; color: white; margin-top: 15px; margin-bottom: 15px; width: 100%; font-size: 16px; }
        .btn-music { background-color: #6f42c1; color: white; margin-bottom: 15px; width: 100%; font-size: 14px; }
        .btn-edit { background-color: #ffc107; color: black; padding: 5px 10px; margin-right: 5px; border-radius: 3px; }
        .btn-delete { background-color: #dc3545; color: white; padding: 5px 10px; border-radius: 3px; }
        .btn-cancel { background-color: #6c757d; color: white; display: none; margin-top: 5px; width: 100%; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; vertical-align: middle; }
        th { background-color: #2f5597; color: white; }
        img.thumb { width: 50px; height: 50px; object-fit: cover; }
    </style>
</head>
<body>

<div class="container">
    <h2>REKAPITULASI PELANGGARAN SISWA/SISWI</h2>
    <h3 class="school-name">SMP GELORA BEKASI</h3>
    <div class="sub-title">TAHUN AJARAN 2026-2027</div>
    
    <!-- Audio Background (Ganti URL dengan link MP3 Anda jika ada) -->
    <audio id="bg-music" loop>
        <source src="https://pdhraphbbdjsabhiokgo.supabase.co/storage/v1/object/public/Sound/Raiso%20Ngapusi%20-%20La%20Tasya%20Feat.%20Aryan%20Tekomlaku%20(HIPHOP%20DANGDUT%20VERSION).mp3" type="audio/mpeg">
    </audio>

    <input type="hidden" id="edit-id">

    <div class="form-group">
        <label>Hari / Tanggal</label>
        <input type="date" id="tanggal">
    </div>
    <div class="form-group">
        <label>Nama Siswa</label>
        <input type="text" id="nama" placeholder="Masukkan nama siswa">
    </div>
    <div class="form-group">
        <label>Kelas</label>
        <input type="text" id="kelas" placeholder="Contoh: 7A">
    </div>
    <div class="form-group">
        <label>Jenis Pelanggaran</label>
        <input type="text" id="pelanggaran" placeholder="Contoh: Terlambat, Baju Dikeluarkan">
    </div>
    <div class="form-group">
        <label>Foto Bukti</label>
        <input type="file" id="foto" accept="image/*">
    </div>

    <button id="btn-save" class="btn-submit" onclick="simpanData()">Simpan Data</button>
    <button id="btn-cancel" class="btn-cancel" onclick="batalEdit()">Batal Edit</button>

    <button class="btn-excel" onclick="exportToExcel()">Export ke Excel (.xlsx)</button>

    <h3 style="text-align: left; margin-top: 25px;">Daftar Pelanggaran</h3>

    <!-- Input Filter / Search -->
    <div class="form-group">
        <input type="text" id="search-input" placeholder="🔍 Cari nama siswa atau kelas..." onkeyup="filterData()" style="padding: 10px; font-size: 14px; border: 2px solid #2f5597; border-radius: 5px;">
    </div>

    <table>
        <thead>
            <tr>
                <th>No</th>
                <th>Tanggal</th>
                <th>Nama</th>
                <th>Kelas</th>
                <th>Pelanggaran</th>
                <th>Foto</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>
</div>

<script>
    // Konfigurasi Supabase
    const SUPABASE_URL = "https://pdhraphbbdjsabhiokgo.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkaHJhcGhiYmRqc2FiaGlva2dvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyODMxODUsImV4cCI6MjEwNDg1OTE4NX0.FesFprS6pIbuz1x2YDOw1rKdvjgirWRBt3sPrR5EhpY";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let records = [];

    // 1. Muat Data Utama
    async function loadData() {
        const { data, error } = await _supabase
            .from('pelanggaran')
            .select('*')
            .order('id', { ascending: true });

        if (error) {
            console.error("Gagal mengambil data:", error);
            return;
        }
        records = data;
        renderTable(records);
    }

    // 2. Render Tabel Data
    function renderTable(dataToRender = records) {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';

        if (!dataToRender || dataToRender.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color: #888;">Data tidak ditemukan</td></tr>`;
            return;
        }

        dataToRender.forEach((item, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td>${item.tanggal || '-'}</td>
                <td>${item.nama || '-'}</td>
                <td>${item.kelas || '-'}</td>
                <td>${item.pelanggaran || '-'}</td>
                <td>${item.foto_url ? `<img src="${item.foto_url}" class="thumb">` : '-'}</td>
                <td>
                    <button class="btn-edit" onclick="editData(${item.id})">Edit</button>
                    <button class="btn-delete" onclick="hapusData(${item.id})">Hapus</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 3. Filter Data Real-time
    function filterData() {
        const keyword = document.getElementById('search-input').value.toLowerCase().trim();
        
        const filtered = records.filter(item => {
            const nama = (item.nama || '').toLowerCase();
            const kelas = (item.kelas || '').toLowerCase();
            return nama.includes(keyword) || kelas.includes(keyword);
        });

        renderTable(filtered);
    }

    // 4. Fitur Musik (Autoplay via Interaksi + Toggle Button)
    function playAudioOnInteraction() {
        const audio = document.getElementById('bg-music');
        audio.volume = 0.2; // Volume 20%
        audio.play().catch(e => console.log("Autoplay ditahan browser:", e));
        document.removeEventListener('click', playAudioOnInteraction);
    }
    document.addEventListener('click', playAudioOnInteraction);

    function toggleMusic() {
        const audio = document.getElementById('bg-music');
        if (audio.paused) {
            audio.play();
        } else {
            audio.pause();
        }
    }

    // 5. Simpan / Update Data
    async function simpanData() {
        const editId = document.getElementById('edit-id').value;
        const tanggal = document.getElementById('tanggal').value;
        const nama = document.getElementById('nama').value;
        const kelas = document.getElementById('kelas').value;
        const pelanggaran = document.getElementById('pelanggaran').value;
        const fotoFile = document.getElementById('foto').files[0];

        if (!nama || !kelas || !pelanggaran) {
            return alert("Nama, Kelas, dan Pelanggaran wajib diisi!");
        }

        let fotoUrl = null;

        if (fotoFile) {
            const fileName = `${Date.now()}_${fotoFile.name}`;
            const { data: uploadData, error: uploadError } = await _supabase.storage
                .from('foto-pelanggaran')
                .upload(fileName, fotoFile);

            if (uploadError) return alert("Gagal mengupload foto: " + uploadError.message);

            const { data: publicUrlData } = _supabase.storage
                .from('foto-pelanggaran')
                .getPublicUrl(fileName);

            fotoUrl = publicUrlData.publicUrl;
        }

        if (editId) {
            const updatePayload = { tanggal, nama, kelas, pelanggaran };
            if (fotoUrl) updatePayload.foto_url = fotoUrl;

            const { error } = await _supabase
                .from('pelanggaran')
                .update(updatePayload)
                .eq('id', editId);

            if (error) alert("Gagal memperbarui data: " + error.message);
            else alert("Data berhasil diperbarui!");
        } else {
            const { error } = await _supabase
                .from('pelanggaran')
                .insert([{ tanggal, nama, kelas, pelanggaran, foto_url: fotoUrl }]);

            if (error) alert("Gagal menyimpan data: " + error.message);
            else alert("Data berhasil disimpan!");
        }

        batalEdit();
        loadData();
    }

    // 6. Persiapan Edit Data
    function editData(id) {
        const item = records.find(r => r.id === id);
        if (!item) return;

        document.getElementById('edit-id').value = item.id;
        document.getElementById('tanggal').value = item.tanggal;
        document.getElementById('nama').value = item.nama;
        document.getElementById('kelas').value = item.kelas;
        document.getElementById('pelanggaran').value = item.pelanggaran;

        document.getElementById('btn-save').innerText = "Update Data";
        document.getElementById('btn-cancel').style.display = "block";
    }

    // 7. Batal Edit
    function batalEdit() {
        document.getElementById('edit-id').value = '';
        document.getElementById('tanggal').value = '';
        document.getElementById('nama').value = '';
        document.getElementById('kelas').value = '';
        document.getElementById('pelanggaran').value = '';
        document.getElementById('foto').value = '';

        document.getElementById('btn-save').innerText = "Simpan Data";
        document.getElementById('btn-cancel').style.display = "none";
    }

    // 8. Hapus Data
    async function hapusData(id) {
        if (!confirm("Apakah Anda yakin ingin menghapus data ini?")) return;

        const { error } = await _supabase
            .from('pelanggaran')
            .delete()
            .eq('id', id);

        if (error) {
            alert("Gagal menghapus data: " + error.message);
        } else {
            alert("Data berhasil dihapus!");
            loadData();
        }
    }

    // 9. Export ke Excel
    async function exportToExcel() {
        if (records.length === 0) return alert("Tidak ada data untuk diexport!");

        try {
            const workbook = new ExcelJS.Workbook();
            const worksheet = workbook.addWorksheet('Rekap Pelanggaran');

            worksheet.mergeCells('A1:F1');
            worksheet.mergeCells('A2:F2');
            worksheet.mergeCells('A3:F3');
            
            const title1 = worksheet.getCell('A1');
            title1.value = "REKAPITULASI PELANGGARAN SISWA/SISWI";
            title1.font = { name: 'Arial', size: 14, bold: true, color: { argb: '1F4E78' } };
            title1.alignment = { horizontal: 'center', vertical: 'middle' };

            const title2 = worksheet.getCell('A2');
            title2.value = "SMP GELORA BEKASI";
            title2.font = { name: 'Arial', size: 12, bold: true, color: { argb: '2F5597' } };
            title2.alignment = { horizontal: 'center', vertical: 'middle' };

            const title3 = worksheet.getCell('A3');
            title3.value = "TAHUN AJARAN 2026-2027";
            title3.font = { name: 'Arial', size: 11, italic: true, bold: true };
            title3.alignment = { horizontal: 'center', vertical: 'middle' };

            worksheet.addRow([]);

            const headers = ["No", "Hari / Tanggal", "Nama Siswa", "Kelas", "Jenis Pelanggaran", "Foto"];
            const headerRow = worksheet.addRow(headers);
            
            headerRow.eachCell((cell) => {
                cell.fill = {
                    type: 'pattern',
                    pattern: 'solid',
                    fgColor: { argb: '2F5597' }
                };
                cell.font = { name: 'Arial', size: 11, bold: true, color: { argb: 'FFFFFF' } };
                cell.alignment = { horizontal: 'center', vertical: 'middle' };
                cell.border = {
                    top: { style: 'thin' }, left: { style: 'thin' },
                    bottom: { style: 'thin' }, right: { style: 'thin' }
                };
            });

            worksheet.getColumn(1).width = 8;
            worksheet.getColumn(2).width = 18;
            worksheet.getColumn(3).width = 28;
            worksheet.getColumn(4).width = 12;
            worksheet.getColumn(5).width = 32;
            worksheet.getColumn(6).width = 20;

            for (let i = 0; i < records.length; i++) {
                const item = records[i];
                const row = worksheet.addRow([
                    i + 1,
                    item.tanggal || "-",
                    item.nama || "-",
                    item.kelas || "-",
                    item.pelanggaran || "-",
                    ""
                ]);

                row.height = 65;

                row.eachCell({ includeEmpty: true }, (cell) => {
                    cell.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true };
                    cell.border = {
                        top: { style: 'thin' }, left: { style: 'thin' },
                        bottom: { style: 'thin' }, right: { style: 'thin' }
                    };
                });

                if (item.foto_url) {
                    try {
                        const response = await fetch(item.foto_url);
                        const arrayBuffer = await response.arrayBuffer();
                        const imageId = workbook.addImage({
                            buffer: arrayBuffer,
                            extension: 'jpeg',
                        });

                        worksheet.addImage(imageId, {
                            tl: { col: 5.35, row: row.number - 0.85 },
                            ext: { width: 60, height: 60 },
                            editAs: 'oneCell'
                        });
                    } catch (e) {
                        console.error("Gagal memuat gambar ke Excel:", e);
                    }
                }
            }

            const buffer = await workbook.xlsx.writeBuffer();
            const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Rekap_Pelanggaran_Siswa_${new Date().toISOString().slice(0,10)}.xlsx`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);

        } catch (err) {
            alert("Terjadi kesalahan saat memproses Excel: " + err.message);
            console.error(err);
        }
    }

    // Jalankan pertama kali saat halaman dibuka
    loadData();
</script>
</body>
</html>
