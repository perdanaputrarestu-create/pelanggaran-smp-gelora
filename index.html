<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pelanggaran Siswa - SMP Gelora Bekasi</title>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- ExcelJS & FileSaver -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/file-saver/2.0.5/FileSaver.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1f4e78; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-submit { background-color: #28a745; color: white; width: 100%; }
        .btn-excel { background-color: #1f4e78; color: white; margin-top: 15px; margin-bottom: 15px; }
        .btn-edit { background-color: #ffc107; color: black; padding: 5px 10px; margin-right: 5px; }
        .btn-delete { background-color: #dc3545; color: white; padding: 5px 10px; }
        .btn-cancel { background-color: #6c757d; color: white; display: none; margin-top: 5px; width: 100%; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; vertical-align: middle; }
        th { background-color: #2f5597; color: white; }
        img.thumb { width: 50px; height: 50px; object-fit: cover; }
    </style>
</head>
<body>

<div class="container">
    <h2>INPUT PELANGGARAN SISWA</h2>
    
    <input type="hidden" id="edit-id"> <!-- ID tersembunyi untuk proses edit -->

    <div class="form-group">
        <label>Hari / Tanggal</label>
        <input type="date" id="tanggal">
    </div>
    <div class="form-group">
        <label>Nama Siswa</label>
        <input type="text" id="nama" placeholder="Masukkan nama siswa">
    </div>
    <div class="form-group">
        <label>Kelas</label>
        <input type="text" id="kelas" placeholder="Contoh: 7A">
    </div>
    <div class="form-group">
        <label>Jenis Pelanggaran</label>
        <input type="text" id="pelanggaran" placeholder="Contoh: Terlambat, Baju Dikeluarkan">
    </div>
    <div class="form-group">
        <label>Foto Bukti</label>
        <input type="file" id="foto" accept="image/*">
    </div>

    <button id="btn-save" class="btn-submit" onclick="simpanData()">Simpan Data</button>
    <button id="btn-cancel" class="btn-cancel" onclick="batalEdit()">Batal Edit</button>

    <button class="btn-excel" onclick="exportToExcel()">Export ke Excel (.xlsx)</button>

    <h3>Daftar Pelanggaran</h3>
    <table>
        <thead>
            <tr>
                <th>No</th>
                <th>Tanggal</th>
                <th>Nama</th>
                <th>Kelas</th>
                <th>Pelanggaran</th>
                <th>Foto</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>
</div>

<script>
    // Konfigurasi Supabase
    const SUPABASE_URL = "https://pdhraphbbdjsabhiokgo.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkaHJhcGhiYmRqc2FiaGlva2dvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyODMxODUsImV4cCI6MjEwNDg1OTE4NX0.FesFprS6pIbuz1x2YDOw1rKdvjgirWRBt3sPrR5EhpY";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let records = [];

    // 1. Muat Data
    async function loadData() {
        const { data, error } = await _supabase
            .from('pelanggaran')
            .select('*')
            .order('id', { ascending: true });

        if (error) {
            console.error("Gagal mengambil data:", error);
            return;
        }
        records = data;
        renderTable();
    }

    // 2. Tampilkan Data di Tabel HTML
    function renderTable() {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';

        records.forEach((item, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td>${item.tanggal || '-'}</td>
                <td>${item.nama || '-'}</td>
                <td>${item.kelas || '-'}</td>
                <td>${item.pelanggaran || '-'}</td>
                <td>${item.foto_url ? `<img src="${item.foto_url}" class="thumb">` : '-'}</td>
                <td>
                    <button class="btn-edit" onclick="editData(${item.id})">Edit</button>
                    <button class="btn-delete" onclick="hapusData(${item.id}, '${item.foto_url}')">Hapus</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 3. Simpan / Update Data
    async function simpanData() {
        const editId = document.getElementById('edit-id').value;
        const tanggal = document.getElementById('tanggal').value;
        const nama = document.getElementById('nama').value;
        const kelas = document.getElementById('kelas').value;
        const pelanggaran = document.getElementById('pelanggaran').value;
        const fotoFile = document.getElementById('foto').files[0];

        if (!nama || !kelas || !pelanggaran) {
            return alert("Nama, Kelas, dan Pelanggaran wajib diisi!");
        }

        let fotoUrl = null;

        // Upload Foto jika ada file baru yang dipilih
        if (fotoFile) {
            const fileName = `${Date.now()}_${fotoFile.name}`;
            const { data: uploadData, error: uploadError } = await _supabase.storage
                .from('foto-pelanggaran')
                .upload(fileName, fotoFile);

            if (uploadError) return alert("Gagal mengupload foto: " + uploadError.message);

            const { data: publicUrlData } = _supabase.storage
                .from('foto-pelanggaran')
                .getPublicUrl(fileName);

            fotoUrl = publicUrlData.publicUrl;
        }

        if (editId) {
            // PROSES UPDATE
            const updatePayload = { tanggal, nama, kelas, pelanggaran };
            if (fotoUrl) updatePayload.foto_url = fotoUrl;

            const { error } = await _supabase
                .from('pelanggaran')
                .update(updatePayload)
                .eq('id', editId);

            if (error) alert("Gagal memperbarui data: " + error.message);
            else alert("Data berhasil diperbarui!");
        } else {
            // PROSES INSERT
            const { error } = await _supabase
                .from('pelanggaran')
                .insert([{ tanggal, nama, kelas, pelanggaran, foto_url: fotoUrl }]);

            if (error) alert("Gagal menyimpan data: " + error.message);
            else alert("Data berhasil disimpan!");
        }

        batalEdit();
        loadData();
    }

    // 4. Persiapan Edit Data
    function editData(id) {
        const item = records.find(r => r.id === id);
        if (!item) return;

        document.getElementById('edit-id').value = item.id;
        document.getElementById('tanggal').value = item.tanggal;
        document.getElementById('nama').value = item.nama;
        document.getElementById('kelas').value = item.kelas;
        document.getElementById('pelanggaran').value = item.pelanggaran;

        document.getElementById('btn-save').innerText = "Update Data";
        document.getElementById('btn-cancel').style.display = "block";
    }

    // 5. Batal Edit
    function batalEdit() {
        document.getElementById('edit-id').value = '';
        document.getElementById('tanggal').value = '';
        document.getElementById('nama').value = '';
        document.getElementById('kelas').value = '';
        document.getElementById('pelanggaran').value = '';
        document.getElementById('foto').value = '';

        document.getElementById('btn-save').innerText = "Simpan Data";
        document.getElementById('btn-cancel').style.display = "none";
    }

    // 6. Hapus Data
    async function hapusData(id, fotoUrl) {
        if (!confirm("Apakah Anda yakin ingin menghapus data ini?")) return;

        // Hapus record dari database
        const { error } = await _supabase
            .from('pelanggaran')
            .delete()
            .eq('id', id);

        if (error) {
            alert("Gagal menghapus data: " + error.message);
        } else {
            alert("Data berhasil dihapus!");
            loadData();
        }
    }

    // Load data awal saat halaman dibuka
    loadData();
</script>
</body>
</html>
